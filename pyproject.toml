[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lima-food-prices-pipeline"
version = "0.1.0"
description = "Daily pipeline, quality checks and dashboard for Lima wholesale food prices (MIDAGRI-SISAP)"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Rodrigo Grandez"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
